name: Test Deployment ID

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Create deployment
        id: deployment
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ github.token }}
          env: test-environment

      - name: Show deployment ID
        run: |
          echo "Deployment ID: ${{ steps.deployment.outputs.deployment_id }}"

      - name: Finish deployment
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ github.token }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env: test-environment
          env_url: https://example.com
          status: success

      - name: Keep workflow alive
        run: sleep 300
