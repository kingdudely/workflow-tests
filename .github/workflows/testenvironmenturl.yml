name: Test Node Deployment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    environment:
      name: awef
      url: ${{ steps.tunnel.outputs.server }}

    steps:
      - name: Establish tunnel
        id: tunnel
        uses: anyvm-org/cf-tunnel@v0
        with:
          protocol: http
          port: 8080
