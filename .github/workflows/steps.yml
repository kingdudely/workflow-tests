name: Test Step Summary

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test live summary
        run: |
          echo "# 🟢 Started" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The step is still running..." >> "$GITHUB_STEP_SUMMARY"

          sleep 30

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "# 🔗 Updated while running" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Click me](https://example.com)" >> "$GITHUB_STEP_SUMMARY"

          sleep 30
